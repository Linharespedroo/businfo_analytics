name: Coleta Frota SPTrans

# Coleta diária da frota de veículos via "Pedra Eletrônica" do SIM (público,
# sem autenticação). Roda collectors/frota_pedra/scraper.py e versiona o JSON
# em data/frota.json.

on:
  schedule:
    # 03:00 BRT (São Paulo, UTC-3) = 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write   # necessário para commitar data/frota.json

concurrency:
  group: coleta-frota
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: collectors/frota_pedra/requirements.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r collectors/frota_pedra/requirements.txt

      - name: Executar coleta
        run: python collectors/frota_pedra/scraper.py

      - name: Commit e push do JSON atualizado
        if: success()
        run: |
          git config user.name  "frota-coleta-bot"
          git config user.email "frota-coleta-bot@users.noreply.github.com"

          git add -A data/frota.json

          if git diff --cached --quiet; then
            echo "Sem mudanças na frota — nada a commitar."
          else
            git commit -m "data: atualiza frota $(date -u +%Y-%m-%dT%H:%MZ)"
            # Retry simples no push (rede transitória)
            for i in 1 2 3 4; do
              if git push origin HEAD:${{ github.ref_name }}; then
                exit 0
              fi
              sleep $((2 ** i))
              git pull --rebase origin ${{ github.ref_name }} || true
            done
            echo "::error::git push falhou após 4 tentativas"
            exit 1
          fi
